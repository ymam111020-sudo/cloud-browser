<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Cloud Ultra Browser</title>
  <script src="/uv/uv.bundle.js"></script>
  <script src="/uv/uv.config.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #121214;
      color: #e4e4e7;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    #top-bar {
      display: flex;
      gap: 10px;
      padding: 10px 16px;
      background: #18181b;
      border-bottom: 1px solid #27272a;
      width: 100%;
      align-items: center;
    }
    .input-box {
      flex: 1;
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid #3f3f46;
      background: #27272a;
      color: #fff;
      font-size: 14px;
      outline: none;
    }
    .input-box:focus { border-color: #3b82f6; }
    button {
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      background: #2563eb;
      color: white;
      font-weight: bold;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.2s;
    }
    button:hover { background: #1d4ed8; }
    #viewport-frame {
      flex: 1;
      width: 100%;
      height: 100%;
      border: none;
      background: #fff;
    }
  </style>
</head>
<body>

  <div id="top-bar">
    <input type="text" id="url-bar" class="input-box" value="https://www.google.com" placeholder="検索ワード または URL を入力">
    <button id="go-btn">開く</button>
  </div>

  <iframe id="viewport-frame"></iframe>

  <script>
    const urlInput = document.getElementById('url-bar');
    const goBtn = document.getElementById('go-btn');
    const iframe = document.getElementById('viewport-frame');

    // Service Worker の登録
    async function registerSW() {
      if ('serviceWorker' in navigator) {
        await navigator.serviceWorker.register('/uv/sw.js', {
          scope: __uv$config.prefix
        });
      }
    }

    async function loadPage() {
      await registerSW();

      let query = urlInput.value.trim();
      if (!query) return;

      let targetUrl = query;
      // URL形式でない場合はGoogle検索として処理
      if (!query.startsWith('http://') && !query.startsWith('https://')) {
        if (query.includes('.') && !query.includes(' ')) {
          targetUrl = 'https://' + query;
        } else {
          targetUrl = 'https://www.google.com/search?q=' + encodeURIComponent(query);
        }
      }
      urlInput.value = targetUrl;

      // Ultraviolet 経由で暗号化・中継エンコードして iframe に読み込む
      iframe.src = __uv$config.prefix + __uv$config.encodeUrl(targetUrl);
    }

    goBtn.addEventListener('click', loadPage);
    urlInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') loadPage();
    });

    // 起動時に自動ロード
    window.onload = loadPage;
  </script>
</body>
</html>
